server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Must match experiments.baseUrl in app.json; works whether or not the ingress strips the prefix
    rewrite ^/dev(?:/(.*))?$ /$1 last;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /+not-found.html;
}